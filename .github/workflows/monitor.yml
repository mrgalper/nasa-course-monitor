name: NASA course monitor
on:
  workflow_dispatch:
  schedule:
    # Every 30 minutes, off the busy top/bottom of the hour (GitHub may still delay or skip runs).
    - cron: '17,47 * * * *'
permissions:
  contents: write
concurrency:
  group: nasa-course-monitor
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Ensure a browser is available
        # GitHub's Ubuntu runners ship Google Chrome; only download Chromium if it is missing.
        run: command -v google-chrome || python -m playwright install --with-deps chromium
      - name: Check course pages and email changes
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          YANA_EMAIL: ${{ secrets.YANA_EMAIL }}
        run: python monitor.py
      - name: Save monitoring state
        if: always()
        run: |
          if [ -f state.json ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add state.json
            if ! git diff --cached --quiet; then
              git commit -m 'Update NASA monitoring state'
              git push
            fi
          fi
